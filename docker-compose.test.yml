# TEST ONLY. Runs the windmill-custom stack against mock-entra (local/test/mock-entra) instead of
# Microsoft Entra ID, as its own compose project with its own test secrets and an in-memory
# database. Never use this file for a deployment. Driven by local/test/e2e.sh, which runs
#   docker compose --env-file local/test/e2e.env \
#     -f docker-compose.yml -f docker-compose.local.yml -f docker-compose.test.yml ...

networks:
  default:
    ipam:
      config:
        # Fixed so ADMIN_ALLOWED_CIDRS in e2e.env can name the address host traffic arrives from.
        - subnet: 172.31.250.0/24

services:
  db:
    volumes: !override
      - ./local/db-init:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /var/lib/postgresql

  mock_entra:
    image: windmill-mock-entra:test
    pull_policy: never
    user: "${GATEWAY_USER:-65532:65532}"
    read_only: true
    environment:
      MOCK_BASE_URL: https://mock-entra:8443
      MOCK_TENANT_ID: ${ENTRA_TENANT_ID}
      MOCK_CLIENT_ID: ${ENTRA_CLIENT_ID}
      MOCK_CLIENT_SECRET_FILE: /run/secrets/entra_client_secret
      MOCK_REDIRECT_URIS: ${PUBLIC_BASE_URL}/sso/callback,${PUBLIC_BASE_URL}/sso/logged-out
      MOCK_TLS_CERT: /etc/mock-entra/mock-entra.crt
      MOCK_TLS_KEY: /etc/mock-entra/mock-entra.key
    secrets:
      - entra_client_secret
    volumes:
      - ./local/test/run/tls:/etc/mock-entra:ro
    networks:
      default:
        aliases: [mock-entra]
    # The test driver on the host plays the browser, which must reach the authorize endpoint.
    ports:
      - "127.0.0.1:${MOCK_ENTRA_BIND_PORT}:8443"

  entra_gateway:
    environment:
      ENTRA_AUTHORITY_URL: https://mock-entra:8443
      GRAPH_BASE_URL: https://mock-entra:8443
      SSL_CERT_FILE: /etc/e2e-ca/ca.crt
    volumes: !override
      - ./local/test/group-mappings.yaml:/etc/entra-gateway/group-mappings.yaml:ro
      - ./local/test/run/tls/ca.crt:/etc/e2e-ca/ca.crt:ro
    depends_on:
      mock_entra:
        condition: service_started

secrets:
  postgres_password:
    file: ./local/test/run/secrets/postgres_password
  windmill_database_url:
    file: ./local/test/run/secrets/windmill_database_url
  windmill_superadmin_secret:
    file: ./local/test/run/secrets/windmill_superadmin_secret
  entra_gateway_db_password:
    file: ./local/test/run/secrets/entra_gateway_db_password
  gateway_database_url:
    file: ./local/test/run/secrets/gateway_database_url
  cookie_key:
    file: ./local/test/run/secrets/cookie_key
  entra_client_secret:
    file: ./local/test/run/secrets/entra_client_secret
