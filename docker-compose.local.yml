# Override of docker-compose.yml for the windmill-custom fork (unlimited users/groups/workspaces,
# Microsoft Entra ID sign-in through local/entra-gateway). Always use it through the wrapper:
#
#   docker compose --env-file local/.env -f docker-compose.yml -f docker-compose.local.yml up -d
#
# Only Caddy publishes host ports. Secrets are files under local/secrets/ (see its README.md).
name: ${COMPOSE_PROJECT_NAME:-windmill-custom}

x-windmill-entrypoint: &windmill-entrypoint
  # Refuses to start when NO_AUTH is set, and loads SUPERADMIN_SECRET from a secret file.
  entrypoint: ["/bin/sh", "/opt/windmill-custom/windmill-entrypoint.sh"]

services:
  db:
    image: postgres:18@sha256:1267c7e692de235fda2a50dbcdbcbca4672ea6a0298576a6bd9d07cafc319b32
    environment: !override
      POSTGRES_DB: windmill
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
      - entra_gateway_db_password
    volumes:
      - db_data:/var/lib/postgresql
      # Runs only when db_data is empty; for an existing volume see local/README.md.
      - ./local/db-init:/docker-entrypoint-initdb.d:ro

  windmill_server:
    image: windmill-custom:local
    pull_policy: never
    <<: *windmill-entrypoint
    environment: !override
      - DATABASE_URL_FILE=/run/secrets/windmill_database_url
      - MODE=server
      - BASE_URL=${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL in local/.env}
      - SUPERADMIN_SECRET_FILE=/run/secrets/windmill_superadmin_secret
      - MAX_SESSION_VALIDITY_SECONDS=28800
      - CREATE_WORKSPACE_REQUIRE_SUPERADMIN=true
      - DISABLE_WORKSPACE_FORK=${DISABLE_WORKSPACE_FORK:-true}
    expose: !override
      - 8000
    secrets:
      - windmill_database_url
      - windmill_superadmin_secret
    volumes:
      - worker_logs:/tmp/windmill/logs
      - ./local/scripts/windmill-entrypoint.sh:/opt/windmill-custom/windmill-entrypoint.sh:ro

  windmill_worker:
    image: windmill-custom:local
    pull_policy: never
    <<: *windmill-entrypoint
    deploy:
      replicas: ${WINDMILL_WORKER_REPLICAS:-1}
    environment: !override
      - DATABASE_URL_FILE=/run/secrets/windmill_database_url
      - MODE=worker
      - WORKER_GROUP=default
      - FAVOR_UNSHARE_PID=true
    secrets:
      - windmill_database_url
    volumes:
      - worker_dependency_cache:/tmp/windmill/cache
      - worker_logs:/tmp/windmill/logs
      - ./local/scripts/windmill-entrypoint.sh:/opt/windmill-custom/windmill-entrypoint.sh:ro

  windmill_worker_native:
    image: windmill-custom:local
    pull_policy: never
    <<: *windmill-entrypoint
    environment: !override
      - DATABASE_URL_FILE=/run/secrets/windmill_database_url
      - MODE=worker
      - WORKER_GROUP=native
      - NATIVE_MODE=true
      - SLEEP_QUEUE=200
    secrets:
      - windmill_database_url
    volumes:
      - worker_logs:/tmp/windmill/logs
      - ./local/scripts/windmill-entrypoint.sh:/opt/windmill-custom/windmill-entrypoint.sh:ro

  # Full-text search is an Enterprise feature: never started.
  windmill_indexer:
    image: windmill-custom:local
    pull_policy: never
    deploy:
      replicas: 0

  # Official windmill-extra image, LSP only. Multiplayer is Enterprise; the debugger stays off.
  windmill_extra:
    image: ghcr.io/windmill-labs/windmill-extra@sha256:e1d9b0afa883a611d0f05abf0c837834588776b4f30ef8b60ff9fc18ceccdd71
    pull_policy: missing
    deploy:
      replicas: ${WINDMILL_EXTRA_REPLICAS:-1}
    expose: !override
      - 3000
    environment: !override
      - ENABLE_LSP=true
      - ENABLE_MULTIPLAYER=false
      - ENABLE_DEBUGGER=false
      - ENABLE_NSJAIL=false
      - WINDMILL_BASE_URL=http://windmill_server:8000

  entra_gateway:
    image: windmill-entra:local
    pull_policy: never
    restart: unless-stopped
    # Compose bind-mounts file secrets with their host owner and mode (600), so the gateway runs
    # as the owner of local/secrets/; up.sh sets this.
    user: "${GATEWAY_USER:-65532:65532}"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    expose:
      - 8080
    environment:
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:-}
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:-}
      ENTRA_CLIENT_SECRET_FILE: /run/secrets/entra_client_secret
      WINDMILL_INTERNAL_URL: http://windmill_server:8000
      WINDMILL_SUPERADMIN_SECRET_FILE: /run/secrets/windmill_superadmin_secret
      GATEWAY_DATABASE_URL_FILE: /run/secrets/gateway_database_url
      COOKIE_KEY_FILE: /run/secrets/cookie_key
      GROUP_MAPPINGS_PATH: /etc/entra-gateway/group-mappings.yaml
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-}
      ADOPT_EXISTING_ACCOUNTS: ${ADOPT_EXISTING_ACCOUNTS:-false}
      RECONCILE_INTERVAL: ${RECONCILE_INTERVAL:-15m}
    secrets:
      - entra_client_secret
      - windmill_superadmin_secret
      - gateway_database_url
      - cookie_key
    volumes:
      - ./local/group-mappings.yaml:/etc/entra-gateway/group-mappings.yaml:ro
    depends_on:
      db:
        condition: service_healthy
      windmill_server:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE:-20m}"
        max-file: "${LOG_MAX_FILE:-10}"

  # Stock Caddy (no layer4 module): HTTP(S) only, SMTP email triggers are out of scope.
  caddy:
    image: caddy:2.11.4@sha256:0c994536bddb66445885237f1a5dcc1916bccea922661c76b4e9fc24061f9b52
    ports: !override
      - "${CADDY_HTTPS_BIND:-443}:443"
      - "${CADDY_HTTP_BIND:-80}:80"
    environment: !override
      - PUBLIC_HOST=${PUBLIC_HOST:?set PUBLIC_HOST in local/.env}
      - CADDY_TLS=${CADDY_TLS:-internal}
      - ADMIN_ALLOWED_CIDRS=${ADMIN_ALLOWED_CIDRS:?set ADMIN_ALLOWED_CIDRS in local/.env}
    volumes: !override
      - ./local/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./local/dist:/srv/source:ro
      - caddy_data:/data
      - caddy_config:/config
      # - ./local/certs:/certs:ro   # for CADDY_TLS="/certs/cert.pem /certs/key.pem"
    # Read by the Caddyfile to refuse SUPERADMIN_SECRET from outside ADMIN_ALLOWED_CIDRS.
    secrets:
      - windmill_superadmin_secret

secrets:
  postgres_password:
    file: ./local/secrets/postgres_password
  windmill_database_url:
    file: ./local/secrets/windmill_database_url
  windmill_superadmin_secret:
    file: ./local/secrets/windmill_superadmin_secret
  entra_gateway_db_password:
    file: ./local/secrets/entra_gateway_db_password
  gateway_database_url:
    file: ./local/secrets/gateway_database_url
  cookie_key:
    file: ./local/secrets/cookie_key
  entra_client_secret:
    file: ./local/secrets/entra_client_secret

volumes:
  caddy_config: null
